<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1510" />
      <stop offset="100%" stop-color="#2A1F17" />
    </linearGradient>
    <filter id="shadow-20" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#grad-20)"/>

  <!-- Subtle corner radial glow -->
  <circle cx="1080" cy="0" r="450" fill="#E6A868" opacity="0.08"/>
  <circle cx="0" cy="1080" r="350" fill="#E6A868" opacity="0.05"/>

  <!-- Outer Framing -->
  <rect x="44" y="44" width="992" height="992" rx="36" fill="none" stroke="#4A3423" stroke-width="2.5"/>
  <rect x="56" y="56" width="968" height="968" rx="28" fill="none" stroke="#4A3423" stroke-width="1" opacity="0.4"/>

  <!-- Brand Header -->
  <g transform="translate(540, 120)">
    <circle cx="-160" cy="-6" r="14" fill="#E6A868" opacity="0.9"/>
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#FAF6F0" text-anchor="middle" letter-spacing="7">FARM-TO-FAMILY</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D4A373" text-anchor="middle" letter-spacing="4">PRIVATE MANAGED FARMING</text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(540, 215)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#382618" stroke="#4A3423" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#EDC69D" text-anchor="middle" letter-spacing="2.5">VALUE &amp; TRUST</text>
  </g>

  <!-- Main Card Container -->
  <rect x="90" y="275" width="900" height="580" rx="32" fill="#2A1F17" stroke="#4A3423" stroke-width="1.5" filter="url(#shadow-20)"/>

  <!-- Content Inside Card -->
  <!-- Headline Line 1 -->
  <text x="540" y="385" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="#FAF6F0" text-anchor="middle">3 Clear Plans.</text>
  
  <!-- Subtitle Line 2 -->
  <text x="540" y="455" font-family="'Playfair Display', Georgia, serif" font-size="42" font-style="italic" fill="#E6A868" text-anchor="middle">1 Uncompromising Commitment.</text>

  <!-- Divider Line -->
  <line x1="440" y1="500" x2="640" y2="500" stroke="#E6A868" stroke-width="2" stroke-linecap="round"/>

  <!-- Explanatory Copy (Wrapped) -->
  <text x="540" y="565" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="400" fill="#DECFC2" text-anchor="middle" width="760">
    No land purchase capital. No labor negotiations. Complete farming peace of mind.
  </text>

  <!-- Key Stat / Feature Highlight Box -->
  <g transform="translate(540, 690)">
    <rect x="-370" y="-36" width="740" height="72" rx="20" fill="#1C1510" stroke="#4A3423" stroke-width="1.5"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="700" fill="#FAF6F0" text-anchor="middle" letter-spacing="1">
