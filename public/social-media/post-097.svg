  </text>

  <!-- Bottom CTA Pill -->
  <g transform="translate(540, 930)">
    <rect x="-310" y="-32" width="620" height="64" rx="32" fill="#D4AF37" filter="url(#shadow-97)"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#121714" text-anchor="middle" letter-spacing="1.5">
