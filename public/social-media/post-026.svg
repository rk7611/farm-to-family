  <!-- Bottom Brand Watermark -->
  <text x="540" y="1025" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D2E3D7" opacity="0.7" text-anchor="middle" letter-spacing="2">
